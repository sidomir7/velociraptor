
name: Linux ARM32 Raspberry Pi Build

on:
  workflow_dispatch:

jobs:
  build-arm32:
    name: Build ARMv7
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            binutils-arm-linux-gnueabihf

      - name: Build ARM32
        env:
          GOMAXPROCS: "2"
          GOFLAGS: "-p=2"
          GOARM: "7"
        run: |
          mkdir -p output
          go run github.com/magefile/mage linuxArmhf

      - name: Verify ARM32 binary
        run: |
          file output/velociraptor-v0.77.3-linux-arm
          arm-linux-gnueabihf-readelf -V \
            output/velociraptor-v0.77.3-linux-arm \
            | grep GLIBC_ || true

      - name: Upload ARM32 binary
        uses: actions/upload-artifact@v4
        with:
          name: velociraptor-v0.77.3-linux-arm32
          path: output/velociraptor-v0.77.3-linux-arm
          if-no-files-found: error
